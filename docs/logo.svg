  <line x1="108" y1="107" x2="120" y2="113" stroke="white" stroke-width="2" />
  <line x1="100" y1="110" x2="100" y2="125" stroke="white" stroke-width="2" />
  <!-- Document symbols -->
  <rect x="155" y="30" width="22" height="28" rx="2" fill="white" opacity="0.3"/>
