<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIDOC Reader</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background: #f5f5f7; color: #1d1d1f; }
  .toolbar { background: #fff; border-bottom: 1px solid #d2d2d7; padding: 12px 20px;
             display: flex; align-items: center; gap: 12px; backdrop-filter: blur(10px);
             position: sticky; top: 0; z-index: 10; }
  .toolbar h1 { font-size: 16px; font-weight: 600; flex: 1; overflow: hidden;
                text-overflow: ellipsis; white-space: nowrap; }
  .toggle-btn { background: #007aff; color: #fff; border: none; border-radius: 6px;
                padding: 8px 16px; font-size: 13px; cursor: pointer; font-weight: 500; }
  .toggle-btn:hover { background: #0066d6; }
  .toggle-btn.secondary { background: #e8e8ed; color: #1d1d1f; }
  .toggle-btn.secondary:hover { background: #d2d2d7; }
  .content { max-width: 820px; margin: 0 auto; padding: 40px 24px; }
  .md-body { line-height: 1.7; font-size: 15px; }
  .md-body h1 { font-size: 28px; margin: 32px 0 16px; font-weight: 700;
                padding-bottom: 8px; border-bottom: 1px solid #e8e8ed; }
  .md-body h2 { font-size: 22px; margin: 28px 0 12px; font-weight: 600; }
  .md-body h3 { font-size: 18px; margin: 20px 0 8px; font-weight: 600; }
  .md-body p { margin: 12px 0; }
  .md-body code { background: #f0f0f5; padding: 2px 6px; border-radius: 4px;
                  font-size: 13px; }
  .md-body pre { background: #1d1d1f; color: #f5f5f7; padding: 16px; border-radius: 8px;
                 overflow-x: auto; margin: 16px 0; }
  .md-body pre code { background: transparent; color: inherit; padding: 0; }
  .md-body blockquote { border-left: 4px solid #007aff; padding: 8px 16px;
                        margin: 16px 0; background: #f0f0f5; border-radius: 0 6px 6px 0; }
  .md-body ul, .md-body ol { margin: 12px 0; padding-left: 24px; }
  .md-body li { margin: 4px 0; }
  .md-body a { color: #007aff; text-decoration: none; }
  .md-body a:hover { text-decoration: underline; }
  .md-body img { max-width: 100%; border-radius: 8px; margin: 16px 0; }
  .md-body table { border-collapse: collapse; margin: 16px 0; width: 100%; }
  .md-body th, .md-body td { border: 1px solid #d2d2d7; padding: 8px 12px; text-align: left; }
  .md-body th { background: #f0f0f5; font-weight: 600; }
  .original-view { display: none; text-align: center; padding: 80px 24px; }
  .original-view .icon { font-size: 64px; margin-bottom: 16px; }
  .original-view h2 { font-size: 20px; margin-bottom: 8px; }
  .original-view p { color: #86868b; margin-bottom: 24px; }
  .original-view .open-btn { background: #007aff; color: #fff; border: none;
                             border-radius: 8px; padding: 12px 32px; font-size: 16px;
                             cursor: pointer; font-weight: 500; }
  .sidebar { display: none; position: fixed; right: 0; top: 49px; bottom: 0;
             width: 280px; background: #fff; border-left: 1px solid #d2d2d7;
             padding: 20px; overflow-y: auto; font-size: 13px; }
  .sidebar h3 { font-size: 12px; text-transform: uppercase; color: #86868b;
                letter-spacing: 0.5px; margin: 16px 0 8px; }
  .sidebar .field { margin: 6px 0; }
  .sidebar .field .label { color: #86868b; }
  </style>
</head>
<body>

<div class="toolbar">
  <h1 id="title">AIDOC Reader</h1>
  <button class="toggle-btn" id="toggleView" onclick="toggleView()">📄 查看原文</button>
  <button class="toggle-btn secondary" id="toggleMeta" onclick="toggleMeta()">📋 元数据</button>
</div>

<div class="content" id="mdView">
  <div class="md-body" id="mdBody">加载中...</div>
</div>

<div class="original-view" id="origView">
  <div class="icon">📄</div>
  <h2>原始文档</h2>
  <p id="origDesc">点击下方按钮使用系统默认应用打开原始文档</p>
  <button class="open-btn" id="openOrigBtn" onclick="openOriginal()">打开原文</button>
  <p style="margin-top:12px;color:#86868b;font-size:13px" id="origFiles"></p>
</div>

<div class="sidebar" id="sidebar">
  <h3>文档信息</h3>
  <div id="metaContent"></div>
  <h3>文件清单</h3>
  <div id="fileList"></div>
</div>

<script>
// 从 URL 参数获取文件路径
const params = new URLSearchParams(window.location.search);
const aidocPath = params.get('file');
const extractDir = params.get('dir');

let fileListData = [];
let showingOrig = false;
let showingMeta = false;

function openOriginal() {
  const skipFiles = ['content.md','metadata.json','manifest.json',
    'signature.p7s','timestamp.tsr','aidoc-files.json','reader.html'];
  const orig = fileListData.find(f => !skipFiles.includes(f) && !f.startsWith('.'));
  if (orig) window.open(orig, '_blank');
  else alert('未找到可打开的原始文档');
}

// 读取文件清单
fetch('aidoc-files.json').then(r => r.json()).then(files => {
  fileListData = files;
  let html = files.map(f => `<div class="field">📄 ${f}</div>`).join('');
  document.getElementById('fileList').innerHTML = html;
  const skipFiles = ['content.md','metadata.json','manifest.json',
    'signature.p7s','timestamp.tsr','aidoc-files.json','reader.html'];
  const origFiles = files.filter(f => !skipFiles.includes(f) && !f.startsWith('.'));
  if (origFiles.length > 0) {
    document.getElementById('origFiles').textContent = '包含: ' + origFiles.join(', ');
    document.getElementById('origDesc').textContent = '点击下方按钮在浏览器中打开';
  }
}).catch(() => {});

function toggleView() {
  showingOrig = !showingOrig;
  document.getElementById('mdView').style.display = showingOrig ? 'none' : 'block';
  document.getElementById('origView').style.display = showingOrig ? 'block' : 'none';
  document.getElementById('toggleView').textContent = showingOrig ? '📝 Markdown' : '📄 查看原文';
}

function toggleMeta() {
  showingMeta = !showingMeta;
  document.getElementById('sidebar').style.display = showingMeta ? 'block' : 'none';
  document.getElementById('toggleMeta').textContent = showingMeta ? '✕ 关闭' : '📋 元数据';
  if (showingMeta) document.getElementById('mdView').style.marginRight = '280px';
  else document.getElementById('mdView').style.marginRight = '0';
}

function openOriginal() {
  // 找到第一个原始文档（排除系统文件）
  const skipFiles = ['content.md', 'metadata.json', 'manifest.json',
    'signature.p7s', 'timestamp.tsr', 'aidoc-files.json', 'reader.html'];
  const links = document.querySelectorAll('#fileList .field');
  for (const link of links) {
    const name = link.textContent.replace('📄 ', '').trim();
    if (!skipFiles.includes(name) && !name.startsWith('.')) {
      window.open(name, '_blank');
      return;
    }
  }
  alert('未找到可打开的原始文档');
}

// 读取 meta.json
fetch('metadata.json').then(r => r.json()).then(meta => {
  document.getElementById('title').textContent = meta.title || '未命名文档';
  let html = '';
  for (const [k, v] of Object.entries(meta)) {
    if (k === 'files' || k === 'extensions') continue;
    const val = Array.isArray(v) ? v.join(', ') : String(v);
    html += `<div class="field"><span class="label">${k}:</span> ${val}</div>`;
  }
  document.getElementById('metaContent').innerHTML = html;
}).catch(() => {});

// 读取文件清单
fetch('aidoc-files.json').then(r => r.json()).then(files => {
  let html = files.map(f => `<div class="field">📄 ${f}</div>`).join('');
  document.getElementById('fileList').innerHTML = html;
  // 找到原始文档（非 content.md, metadata.json）
  const origFiles = files.filter(f => f !== 'content.md' && f !== 'metadata.json' &&
    f !== 'manifest.json' && f !== 'signature.p7s' && f !== 'timestamp.tsr' &&
    f !== 'aidoc-files.json');
  if (origFiles.length > 0) {
    document.getElementById('origFiles').textContent = '包含: ' + origFiles.join(', ');
    document.getElementById('origDesc').textContent = '点击下方按钮使用系统默认应用打开';
  }
}).catch(() => {});

// 读取并渲染 content.md
fetch('content.md').then(r => r.text()).then(md => {
  document.getElementById('mdBody').innerHTML = renderMarkdown(md);
}).catch(() => {
  document.getElementById('mdBody').innerHTML = '<p style="color:#86868b">无法读取 content.md</p>';
});

function renderMarkdown(md) {
  // 简单的 Markdown → HTML 渲染
  let html = md;
  // 代码块（必须最先处理）
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  // 行内代码
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  // 图片
  html = html.replace(/!\[(.*?)\]\((.*?)\)/g, '<img src="$2" alt="$1">');
  // 链接
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
  // 加粗 + 斜体
  html = html.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
  // 任务列表
  html = html.replace(/- \[x\] /gi, '<li><input type="checkbox" checked disabled>');
  html = html.replace(/- \[ \] /gi, '<li><input type="checkbox" disabled>');
  // 无序列表
  html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');
  // 引用
  html = html.replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>');
  // 水平线
  html = html.replace(/^---$/gm, '<hr>');
  // 标题
  html = html.replace(/^###### (.+)$/gm, '<h6>$1</h6>');
  html = html.replace(/^##### (.+)$/gm, '<h5>$1</h5>');
  html = html.replace(/^#### (.+)$/gm, '<h4>$1</h4>');
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  // 段落（剩余未包裹的文本）
  html = html.replace(/^([^<>\n].+)$/gm, '<p>$1</p>');
  // 清理空标签
  html = html.replace(/<p><\/p>/g, '');
  html = html.replace(/\n{2,}/g, '\n');
  return html;
}
</script>
</body>
</html>
